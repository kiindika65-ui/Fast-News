name: RSS Only Professional News Video

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-news-video:
    runs-on: ubuntu-latest

    env:
      PAGE_NAME: "World Pulse Daily"
      VOICE: "en-US-GuyNeural"
      MAX_VIDEOS_PER_RUN: "1"
      VIDEO_SECONDS_MIN: "35"
      VIDEO_SECONDS_MAX: "55"

      # true = use image from RSS item when available
      # false = safest copyright mode, generated background only
      USE_RSS_IMAGES: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix folders
        run: |
          if [ -f output ]; then rm output; fi
          if [ -f assets ]; then rm assets; fi
          mkdir -p output
          mkdir -p assets

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RSS news video bot
        run: |
          python bot.py

      - name: Upload created videos
        uses: actions/upload-artifact@v4
        with:
          name: rss-news-videos
          path: |
            output/*.mp4
            output/*.json

      - name: Save state file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add state.json output/*.json || true
          git commit -m "Update RSS news video state" || echo "No changes to commit"
          git push || true
